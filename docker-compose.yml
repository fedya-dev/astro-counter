# docker-compose.yml — Astro Visitor Counter
# One-command deployment:  docker compose up -d
#
# After starting:
#   - Open http://YOUR-SERVER-IP:3000
#   - Click "Отключи детайлите" → enter PIN
#   - Register your sites in the "Управление на сайтове" modal
#   - Copy the JS snippet for each site and embed it on the real site

services:
  astro:
    # Build locally from this directory
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional: set the public URL during build for the snippet.
        # If blank, the snippet uses the URL the user accesses the dashboard from.
        NEXT_PUBLIC_BASE_URL: ""
    # Or pull a pre-built image once you push one to a registry:
    # image: ghcr.io/yourusername/astro-counter:latest

    container_name: astro-counter
    restart: unless-stopped

    ports:
      - "3000:3000"
      # To use a different host port (e.g. 8080), change the left side:
      # - "8080:3000"

    environment:
      # ====== REQUIRED: change this PIN to your own secret ======
      ADMIN_PIN: "1234"

      # ====== OPTIONAL: public URL of your deployment ======
      # If set, snippets generated by the dashboard will use this exact URL.
      # If blank, the dashboard auto-detects the URL from incoming requests
      # (works behind reverse proxies like Caddy/Nginx/Traefik).
      NEXT_PUBLIC_BASE_URL: ""

      # ====== OPTIONAL: database location (default is fine) ======
      DATABASE_URL: "file:/app/data/custom.db"

      # ====== OPTIONAL: timezone for daily visit boundaries ======
      TZ: "Europe/Sofia"

    volumes:
      # Persistent SQLite database + any other runtime files
      - astro-data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/track"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  astro-data:
    driver: local
