services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ""
    container_name: astro-counter
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_PIN: "1234"
      NEXT_PUBLIC_BASE_URL: ""
      DATABASE_URL: "file:/app/data/custom.db"
      TZ: "Europe/Sofia"
    volumes:
      - astro-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/track"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  astro-data:
    driver: local
